<style>

.tabs{display:flex;gap:8px;margin:14px 0;justify-content:center}

.it{background:#3a2f66;border:3px solid var(--rc,#0d0a1f);border-radius:16px;padding:10px;cursor:pointer;transition:transform .15s;font-size:13px}

.it b{font-size:16px}.it small{display:block;color:var(--sub)}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #0d0a1f;vertical-align:middle;margin-right:6px}
.buy{display:block;margin-top:8px;width:100%;font:inherit;font-weight:800;padding:5px;border-radius:10px;border:3px solid #0d0a1f;background:#6bcb77;cursor:pointer;color:#241b3d}
.buy.no{background:#8a8aa8}.shake{animation:sh .4s}

@keyframes glow{to{box-shadow:0 0 16px #ffd93d}}

.enter .it{animation:itin .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*55ms)}@keyframes itin{from{opacity:0;transform:translateY(24px) scale(.85)}}

#setup .g-nt,#setup .g-ps,#setup .g-lv{display:none}
#setup[data-m='t'] .g-nt,#setup[data-m='t'] .g-ps,#setup[data-m='c'] .g-ps,#setup[data-m='v'] .g-ps,#setup[data-m='v'] .g-lv,#setup[data-m='x'] .g-lv,#setup[data-m='s'] .g-lv{display:block}
.info{grid-column:1/-1;text-align:left;font-size:13px;line-height:1.6;color:var(--sub)}.info b{color:#ffd93d}
.ico{display:block;width:100%;height:58px;object-fit:contain;margin-bottom:4px}
textarea,.it input{width:100%;box-sizing:border-box;background:#0d0a1f;color:#fff;border:3px solid #3a2f66;border-radius:10px;font:12px monospace;margin:6px 0;padding:6px}.it input{font:700 14px sans-serif}

.note{grid-column:1/-1;font-size:13px;color:var(--sub);background:#0d0a1f;border-radius:12px;padding:8px 10px}.up{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.up .buy{font-size:11px;margin:0;padding:3px}.tabs{flex-wrap:wrap}
